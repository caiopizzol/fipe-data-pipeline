# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  custom_instructions: >-
    Scrutinize crawl filtering and checkpoint changes for silent partial-data completion. Reference
    completion must come from an empty checkpoint backlog, failed FIPE items must remain pending for
    retry, reruns must stay idempotent, and targeted or --force crawls must not advance or clear
    checkpoint state outside their explicit scope.
