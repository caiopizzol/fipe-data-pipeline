services:
  postgres:
    image: postgres:16-alpine
    container_name: fipe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fipe
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d fipe"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    profiles: [pipeline]
    build:
      context: .
      args:
        POSTGRES_MAJOR: 16
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fipe
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
