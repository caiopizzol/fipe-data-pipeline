name: Test integrity

# Runs the base branch's copy of this workflow, so a pull request cannot change the check that
# judges it. The action reads git only and never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# A run started by a label change can finish before an older run on the same commit. Only the
# latest run for a pull request counts, so an older result never overwrites a newer one.
concurrency:
  group: test-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-integrity:
    name: Test integrity
    runs-on: ubuntu-latest
    steps:
      - uses: caiopizzol/skills/.github/actions/test-integrity@d8185b941f065c5ab2b1dbcf46dc300af736ecb5
