name: Pickled

on:
  pull_request:
  workflow_dispatch:
    inputs:
      max_cells:
        description: "Abort real-agent runs above this execution count"
        required: false
        default: "12"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run docs:check

  real-agent:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx pickled check . --max-cells "${PICKLED_MAX_CELLS:-12}"
        env:
          PICKLED_MAX_CELLS: ${{ inputs.max_cells }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_PICKLED }}
      - run: bunx pickled build . --max-cells 4
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_PICKLED }}
